apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: future-amplifiers
  namespace: future-amplifiers
  labels:
    app.kubernetes.io/name: future-amplifiers
  annotations:
    # Replace "nginx" below if you use a different Ingress controller
    # (e.g. traefik, haproxy, contour) or a cloud-specific controller.
    kubernetes.io/ingress.class: nginx
    # Optional: force HTTPS via cert-manager
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: amplifiers.example.com   # <-- replace with your real domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: future-amplifiers
                port:
                  name: http
  # Enable once you have cert-manager provisioned:
  # tls:
  #   - hosts:
  #       - amplifiers.example.com
  #     secretName: amplifiers-tls
