apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: future-amplifiers
  namespace: future-amplifiers
  labels:
    app.kubernetes.io/name: future-amplifiers
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - amplifiers.s11o.me
      secretName: amplifiers-tls
  rules:
    - host: amplifiers.s11o.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: future-amplifiers
                port:
                  name: http
