# Future Amplifiers - nginx site configuration
#
# Runs on port 8080 as a non-root user, applies security headers, caches
# immutable static assets, and exposes a /healthz endpoint for Kubernetes
# liveness/readiness probes.
#
# NOTE: runtime files (pid, client temp) are placed under /tmp because the
# Kubernetes deployment mounts /tmp as an emptyDir and sets
# readOnlyRootFilesystem: true. The static content under /usr/share/nginx/html
# is served read-only.

pid /tmp/nginx.pid;

# Run worker processes as the unprivileged "nginx" user.
# This must match the USER directive in the Dockerfile.
user nginx;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Log to stdout/stderr so `kubectl logs` works and nginx keeps running
    # read-only without needing a writable /var/log
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # NOTE: upgrade to `Content-Security-Policy` here if the site removes all
        # inline styles/scripts. It currently relies on inline styles, so CSP is
        # intentionally left off to avoid breaking the page.

        charset utf-8;

        # Kubernetes readiness/liveness probe endpoint
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Long-term cache for versioned/static assets
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Default HTML routing (serve index.html for directory requests)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files (e.g. .git, .dockerignore, .DS_Store)
        location ~ /\. {
            deny all;
        }
    }
}
